name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --examples
      - run: cargo package --locked
  arm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [arm-unknown-linux-gnueabihf, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'arm-unknown-linux-gnueabihf'
        run: echo 'RUSTFLAGS=-C target-cpu=arm1176jzf-s' >> "$GITHUB_ENV"
      - run: cargo check --locked --lib --examples --target ${{ matrix.target }}
